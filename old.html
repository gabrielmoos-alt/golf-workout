<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Strength">
<meta name="theme-color" content="#15181d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Golf Strength · 6-Week Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#15181d; --iron2:#1d2129; --line:#2b303b;
    --chalk:#ece7dc; --chalk-dim:#9aa0ab;
    --fairway:#5fa06a; --fairway-deep:#3c7a49;
    --sand:#c9a96a;
    --danger:#c0704f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--iron); color:var(--chalk);
    font-family:'Inter',-apple-system,sans-serif; font-size:15px; line-height:1.4}
  body{padding-bottom:env(safe-area-inset-bottom)}

  /* ---------- header ---------- */
  header{position:sticky; top:0; z-index:10; background:var(--iron);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 0}
  .brand{display:flex; align-items:baseline; justify-content:space-between}
  .brand h1{font-family:'Barlow Condensed'; font-weight:700; font-size:20px;
    letter-spacing:.06em; text-transform:uppercase; margin:0}
  .brand h1 em{font-style:normal; color:var(--sand)}
  .day-progress{font-family:'IBM Plex Mono'; font-size:12px; color:var(--chalk-dim)}
  .day-progress b{color:var(--fairway)}

  .weeks{display:flex; gap:6px; margin:10px 0}
  .wk{flex:1; border:1px solid var(--line); background:none; color:var(--chalk-dim);
    font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.04em;
    padding:6px 0; border-radius:6px; cursor:pointer}
  .wk.on{background:var(--sand); border-color:var(--sand); color:#1a1a14}
  .wk.deload{border-style:dashed}
  .wk:focus-visible,.day:focus-visible,button:focus-visible{outline:2px solid var(--sand); outline-offset:2px}

  .days{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{white-space:nowrap; border:1px solid var(--line); background:none; color:var(--chalk-dim);
    font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.05em;
    text-transform:uppercase; padding:7px 13px; border-radius:6px; cursor:pointer}
  .day.on{background:var(--iron2); border-color:var(--fairway); color:var(--chalk)}

  /* ---------- content ---------- */
  main{padding:14px 16px 40px; max-width:640px; margin:0 auto}
  .session-title{font-family:'Barlow Condensed'; font-weight:700; font-size:26px;
    text-transform:uppercase; letter-spacing:.04em; margin:2px 0 0}
  .session-sub{color:var(--chalk-dim); font-size:13px; margin:2px 0 14px}
  .deload-tag{display:inline-block; font-family:'IBM Plex Mono'; font-size:11px;
    color:var(--sand); border:1px solid var(--sand); border-radius:4px; padding:1px 7px;
    margin-left:8px; vertical-align:middle; letter-spacing:.08em}

  .block{margin-bottom:18px}
  .eyebrow{font-family:'IBM Plex Mono'; font-size:11px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color:var(--sand);
    border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:2px;
    display:flex; justify-content:space-between}
  .eyebrow .hint{color:var(--chalk-dim); letter-spacing:.02em; text-transform:none; font-weight:500}

  .ex{padding:11px 0; border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:none}
  .ex-top{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
  .ex-name{font-weight:600; font-size:15px}
  .ex-load{font-family:'IBM Plex Mono'; font-weight:600; font-size:16px;
    color:var(--fairway); white-space:nowrap}
  .ex-load small{font-size:11px; color:var(--chalk-dim); font-weight:500}
  .ex-scheme{font-family:'IBM Plex Mono'; font-size:12px; color:var(--chalk-dim); margin-top:1px}
  .ex-note{font-size:12.5px; color:var(--chalk-dim); margin-top:4px}

  /* plates = set toggles */
  .plates{display:flex; gap:10px; margin-top:9px}
  .plate{width:40px; height:40px; border-radius:50%; cursor:pointer;
    border:2px solid var(--line); background:radial-gradient(circle at 50% 50%, var(--iron2) 28%, #232833 29%);
    position:relative; transition:border-color .15s, background .15s; padding:0}
  .plate::after{content:''; position:absolute; inset:0; margin:auto; width:8px; height:8px;
    border-radius:50%; background:var(--iron); border:1px solid var(--line)}
  .plate.done{border-color:var(--fairway);
    background:radial-gradient(circle at 50% 50%, var(--fairway-deep) 28%, var(--fairway) 29%)}
  .plate.done::after{border-color:var(--fairway-deep)}
  @media (prefers-reduced-motion: no-preference){
    .plate:active{transform:scale(.9)} .plate{transition:border-color .15s, background .15s, transform .08s}
  }

  /* rest timer */
  .timer{display:flex; align-items:center; gap:10px; margin-top:9px}
  .t-disp{font-family:'IBM Plex Mono'; font-weight:600; font-size:19px;
    color:var(--chalk-dim); min-width:58px}
  .t-disp.running{color:var(--sand)}
  .t-btn{border:1px solid var(--line); background:none; color:var(--chalk);
    font-family:'Barlow Condensed'; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; font-size:13px; padding:6px 14px; border-radius:6px; cursor:pointer}

  /* ---------- setup ---------- */
  .setup p{color:var(--chalk-dim); font-size:13.5px}
  .field{display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line)}
  .field label{font-weight:600; font-size:14.5px}
  .field label small{display:block; font-weight:400; font-size:12px; color:var(--chalk-dim)}
  .field input{width:96px; background:var(--iron2); border:1px solid var(--line); border-radius:8px;
    color:var(--chalk); font-family:'IBM Plex Mono'; font-weight:600; font-size:17px;
    text-align:center; padding:9px 6px}
  .field input:focus{border-color:var(--sand); outline:none}
  .derived{font-family:'IBM Plex Mono'; font-size:12px; color:var(--fairway); text-align:right}
  .btn{width:100%; margin-top:16px; padding:12px; border-radius:8px; border:1px solid var(--line);
    background:none; color:var(--chalk-dim); font-family:'Barlow Condensed'; font-weight:600;
    font-size:15px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer}
  .btn.danger{border-color:var(--danger); color:var(--danger)}
  .io{width:100%; min-height:88px; background:var(--iron2); border:1px solid var(--line);
    border-radius:8px; color:var(--chalk); font-family:'IBM Plex Mono'; font-size:11px;
    padding:8px; margin-top:10px; resize:vertical}
  .io:focus{border-color:var(--sand); outline:none}
  .btnrow{display:flex; gap:10px}
  .btnrow .btn{margin-top:10px}
  .storage-note{font-size:11.5px; color:var(--chalk-dim); margin-top:14px; text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Golf <em>Strength</em> · 6-Wk</h1>
    <div class="day-progress" id="prog"></div>
  </div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>

<script>
/* ================= data ================= */
const WD_PCT  = [.725,.75,.775,.70,.775,.80];
const ROW_PCT = [.70,.725,.75,.675,.75,.775];
const WE_MAIN = [[4,5,.75],[4,4,.80],[3,3,.85],[3,5,.725],[4,3,.875],[2,2,.925]];
const WE_MAIN_NOTE = [
  "Crisp bar speed. Rest 2–3 min.",
  "Rest 2–3 min. No grinders yet.",
  "Heavy, clean triples. Rest 3 min.",
  "Deload — smooth and fast, leave fresh.",
  "Rest 3+ min. Last set an honest RPE 8–9.",
  "Peak week. Optional single at ~95% if the doubles fly."
];
const VO2 = [
  ["4 × 2 min hard / 2 min easy","~18 min at 8–9/10 effort (~90% max HR)."],
  ["4 × 3 min hard / 2 min easy","~22 min. Pace interval 1 so interval 4 is completable."],
  ["4 × 4 min hard / 3 min easy","~28 min. The classic Norwegian 4×4."],
  ["20 min easy Zone 2","Deload — conversational pace only."],
  ["5 × 3 min hard / 2.5 min easy","~28 min. Hold week 3's hard pace."],
  ["4 × 4 min hard / 3 min easy","~28 min. Beat week 3's output at the same effort."]
];
const DELOAD = 3;

const ex = (name, sets, reps, o={}) => ({name, sets, reps, ...o});

function dayDef(d, w){
  const wd = WD_PCT[w], rw = ROW_PCT[w];
  const [ms, mr, mp] = WE_MAIN[w];
  const a = w===DELOAD?3:4, b = w===DELOAD?2:3;   // long-day superset volumes
  if(d===1){
    const sumoWk = w%2===1, lift = sumoWk?"sumo":"dead", nm = sumoWk?"Sumo deadlift":"Deadlift";
    return {title:"Day 1 \u00b7 "+nm+" + Pull", sub:"Long session \u00b7 back of body", blocks:[
      {label:"Core + activation \u00b7 3 rounds", items:[
        ex("Bird dog",3,"8/side",{note:"McGill Big 3. Slow and braced, no wobble."}),
        ex("Glute bridge",3,"12",{note:"Hard squeeze at the top."}),
        ex("Suitcase carry",3,"30s/side",{load:"50 lb DB",note:"SquatU's #1 core pick \u2014 walk tall, don't lean."}) ]},
      {label:"Ramped warm-up", items:[
        ex(nm+" \u2014 warm-up",1,"5",{lift,pct:.40}),
        ex(nm+" \u2014 warm-up",1,"3",{lift,pct:.55}),
        ex(nm+" \u2014 warm-up",1,"2",{lift,pct:.70,note:"Full setup, full brace."}) ]},
      {label:"Main lift \u00b7 heavy", items:[
        ex(nm,ms,String(mr),{lift,pct:mp,note:WE_MAIN_NOTE[w],timer:1}) ]},
      {label:"Superset A \u00b7 "+a+" rounds", items:[
        ex("Weighted pull-up / lat pulldown",a,"8",{load:"RPE 8",note:"Nippard S-tier \u2014 full stretch at the top."}),
        ex("Barbell RDL",a,"8",{lift:"dead",pct:.50,note:"Replaces pull-throughs. Nippard top-5 overall; add 5\u201310 lb weekly while form is crisp."}) ]},
      {label:"Superset B \u00b7 "+b+" rounds", items:[
        ex("EZ-bar curl",b,"10",{load:"RPE 8",note:"Emphasize the stretch at the bottom."}),
        ex("Standing calf raise",b,"15",{load:"RPE 8",note:"2-sec pause in the bottom stretch \u2014 that's where growth happens."}),
        ex("Barbell shrug",b,"12",{lift:"dead",pct:.55,note:"Swapped from DBs \u2014 the 50s were too light for you. 2-sec hold at top."}) ]},
      {label:"VO2 finisher", items:[ ex(VO2[w][0],1,"\u2014",{note:VO2[w][1]}) ]}
    ]};
  }
  if(d===2) return {title:"Day 2 \u00b7 Squat + Push", sub:"Long session \u00b7 front of body", blocks:[
    {label:"Core + activation \u00b7 3 rounds", items:[
      ex("Side plank",3,"30s/side",{note:"McGill Big 3 \u2014 lateral core, big for swing stability."}),
      ex("DB push press (explosive)",3,"5",{load:"25\u201335 lb",note:"Quiet power primer: fast dip, hard drive."}),
      ex("Goblet squat",3,"8",{load:"25\u201335 lb",note:"SquatU squat prep \u2014 grooves depth, upright torso."}) ]},
    {label:"Ramped warm-up", items:[
      ex("Squat \u2014 warm-up",1,"5",{lift:"squat",pct:.40}),
      ex("Squat \u2014 warm-up",1,"3",{lift:"squat",pct:.55}),
      ex("Squat \u2014 warm-up",1,"2",{lift:"squat",pct:.70,note:"Full setup, full brace."}) ]},
    {label:"Main lift \u00b7 heavy", items:[
      ex("Back squat",ms,String(mr),{lift:"squat",pct:mp,note:WE_MAIN_NOTE[w],timer:1}) ]},
    {label:"Superset A \u00b7 "+a+" rounds", items:[
      ex("Incline DB press",a,"8",{load:"3-sec lowering",note:"Nippard's #3 lift overall. 50s are near your cap \u2014 slow negatives + a pause keep them honest. Sub: chest press machine."}),
      ex("Cable lateral raise",a,"12",{load:"RPE 8",note:"Nippard's #1 side-delt pick \u2014 tension in the stretch, unlike DBs."}) ]},
    {label:"Superset B \u00b7 "+b+" rounds", items:[
      ex("Shoulder press machine",b,"10",{load:"RPE 8",note:"Nippard's favorite delt press \u2014 deep stretch, zero balance tax."}),
      ex("Overhead cable triceps extension",b,"12",{load:"RPE 8",note:"Beats pushdowns for the long head \u2014 the overhead stretch drives more growth."}) ]},
    {label:"VO2 finisher", items:[ ex(VO2[w][0],1,"\u2014",{note:VO2[w][1]+" Use the other machine from Day 1."}) ]}
  ]};
  if(d===3) return {title:"Day 3 \u00b7 Bench", sub:"30-minute session", blocks:[
    {label:"Cardio warm-up", hint:"~5 min", items:[ ex("Easy run or spin",1,"5 min") ]},
    {label:"Circuit \u00b7 3 rounds", hint:"no rest", items:[
      ex("Cable face pull",3,"15",{note:"Nippard S-tier \u2014 primes upper back for pressing."}),
      ex("Dead bug",3,"10/side",{note:"Slow. Ribs down, low back glued to floor."}) ]},
    {label:"Main lift", hint:"~12 min", items:[
      ex("Bench press",3,"5",{lift:"bench",pct:wd,note:"1 empty-bar + 1 light set first.",timer:1}) ]},
    {label:"Athletic superset \u00b7 3 rounds", items:[
      ex("Med ball rotational throw",3,"8/side",{load:"10\u201312 lb",note:"Too loud? Sub explosive cable rotation."}),
      ex("Half-kneeling 1-arm lat pulldown",3,"10/side",{load:"RPE 8",note:"Nippard S-tier. Replaces DB rows \u2014 the stack loads past your 50s, and half-kneeling adds anti-rotation."}) ]}
  ]};
  if(d===4) return {title:"Day 4 \u00b7 Overhead Press", sub:"30-minute session", blocks:[
    {label:"VO2 sprinkle", hint:"~5 min", items:[
      ex("30s hard / 30s easy intervals",1,"5 min",{note:"After 1 easy min, alternate 30/30 at 8/10 effort."}) ]},
    {label:"Circuit \u00b7 3 rounds", hint:"no rest", items:[
      ex("Cable external rotation",3,"12/side",{note:"Light \u2014 cuff prep."}),
      ex("Hanging knee raise",3,"10",{note:"No swinging."}) ]},
    {label:"Main lift", hint:"~12 min", items:[
      ex("Overhead press",3,"5",{lift:"ohp",pct:wd,note:"Glutes tight, no lean-back.",timer:1}) ]},
    {label:"Athletic superset \u00b7 3 rounds", items:[
      ex("Cable woodchop (high\u2192low)",3,"10/side",{load:"RPE 7",note:"Rotate from hips, arms long \u2014 downswing pattern."}),
      ex("DB Bulgarian split squat",3,"8/side",{load:"up to 50s",note:"Rear foot LOW on the bench \u2014 SquatU cue: too high overarches the back. More load per leg under your DB cap."}) ]}
  ]};
  return {title:"Day 5 \u00b7 Barbell Row", sub:"30-minute session", blocks:[
    {label:"Cardio warm-up", hint:"~5 min", items:[ ex("Easy run or spin",1,"5 min") ]},
    {label:"Circuit \u00b7 3 rounds", hint:"no rest", items:[
      ex("Scap pull-up",3,"8",{note:"Hang, shrug the blades. Sub: band pull-apart \u00d715."}),
      ex("Pallof press",3,"10/side",{note:"Anti-rotation \u2014 pure golf transfer."}) ]},
    {label:"Main lift", hint:"~12 min", items:[
      ex("Barbell row",3,"8",{lift:"row",pct:rw,note:"Kept as a strength lift \u2014 Nippard grades it mid for pure size, but your pulldowns and pull-ups cover that.",timer:1}) ]},
    {label:"Athletic superset \u00b7 3 rounds", items:[
      ex("Single-leg DB RDL",3,"8/side",{load:"RPE 7",note:"SquatU staple \u2014 balance + posterior chain for swing stability."}),
      ex("Pull-ups",3,"AMRAP\u22121",{load:"BW",note:"S-tier. Stop one rep shy of failure."}) ]}
  ]};
}

/* ================= state + storage ================= */
let state = {
  week:0, day:0,   // day 0 = setup, 1..5 = training days
  maxes:{bench:"215",squat:"295",dead:"295",sumo:"315",ohp:"125",row8:"135",inc:5},
  checks:{}
};
let storageOK = true;

async function loadState(){
  let raw = null;
  try{
    if(window.storage){ const r = await window.storage.get("golfplan:v2"); raw = r && r.value; }
  }catch(e){ /* no saved data yet in artifact storage */ }
  if(!raw){ try{ raw = localStorage.getItem("golfplan:v2"); }catch(e){} }
  if(raw){
    try{ const s = JSON.parse(raw);
      state = {...state, ...s, maxes:{...state.maxes, ...(s.maxes||{})}}; }catch(e){}
  }
  storageOK = await writeState(true);
}
async function writeState(probe){
  const payload = probe ? null : JSON.stringify(
    {week:state.week, day:state.day, maxes:state.maxes, checks:state.checks});
  let ok = false;
  try{
    if(window.storage){
      await window.storage.set(probe ? "golfplan:ping" : "golfplan:v2", probe ? "1" : payload);
      ok = true;
    }
  }catch(e){}
  try{
    if(probe){ localStorage.setItem("golfplan:ping","1"); }
    else{ localStorage.setItem("golfplan:v2", payload); }
    ok = true;
  }catch(e){}
  return ok;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ storageOK = await writeState(false); }, 400);
}

/* ================= calc ================= */
const num = v => { const n = parseFloat(v); return isFinite(n)&&n>0 ? n : null; };
function oneRM(lift){
  const m = state.maxes;
  if(lift==="row"){ const w = num(m.row8); return w ? Math.round(w*(1+8/30)) : null; }
  if(lift==="sumo"){ const s = num(m.sumo); if(s) return s;
    const d = num(m.dead); return d ? Math.round(d*.925) : null; }
  return num(m[lift]);
}
function wt(lift,pct){
  const rm = oneRM(lift); if(!rm) return null;
  const inc = num(state.maxes.inc) || 5;
  return Math.round(rm*pct/inc)*inc;
}

/* ================= render ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  renderWeeks(); renderDays();
  if(state.day===0) renderSetup(); else renderSession();
  renderProgress();
}
function renderWeeks(){
  $("weeks").innerHTML = [0,1,2,3,4,5].map(w=>
    `<button class="wk ${w===state.week?"on":""} ${w===DELOAD?"deload":""}"
      onclick="setWeek(${w})" aria-label="Week ${w+1}">W${w+1}</button>`).join("");
}
function renderDays(){
  const names = ["Setup","D1 Pull","D2 Squat","D3 Bench","D4 OHP","D5 Row"];
  $("days").innerHTML = names.map((n,i)=>
    `<button class="day ${i===state.day?"on":""}" onclick="setDay(${i})">${n}</button>`).join("");
}
function key(d,b,i,s){ return `${state.week}-${d}-${b}-${i}-${s}`; }

function renderSession(){
  const def = dayDef(state.day, state.week);
  let h = `<div class="session-title">${esc(def.title)}${state.week===DELOAD?'<span class="deload-tag">DELOAD</span>':""}</div>
           <div class="session-sub">Week ${state.week+1} · ${esc(def.sub)}</div>`;
  def.blocks.forEach((blk,bi)=>{
    h += `<div class="block"><div class="eyebrow"><span>${esc(blk.label)}</span>${blk.hint?`<span class="hint">${esc(blk.hint)}</span>`:""}</div>`;
    blk.items.forEach((it,ii)=>{
      let load = "";
      if(it.pct!=null){
        const w = wt(it.lift,it.pct);
        load = w ? `${w} <small>lb · ${(it.pct*100).toFixed(1).replace(/\.0$/,"")}%</small>`
                 : `<small>set max in Setup</small>`;
      } else if(it.load) load = `<small>${esc(it.load)}</small>`;
      const plates = Array.from({length:it.sets>1||it.sets===1?it.sets:0},(_,si)=>{
        const done = !!state.checks[key(state.day,bi,ii,si)];
        return `<button class="plate ${done?"done":""}" aria-label="Set ${si+1}${done?" done":""}"
                 onclick="toggle(${bi},${ii},${si})"></button>`;
      }).join("");
      let timerHtml = "";
      if(it.timer){
        const tid = `${state.day}-${bi}-${ii}`;
        const t = TIMERS[tid], running = !!(t && t.startTs);
        const el = t ? t.acc + (running ? (Date.now()-t.startTs)/1000 : 0) : 0;
        timerHtml = `<div class="timer"><span class="t-disp${running?" running":""}" id="td-${tid}">${tfmt(el)}</span>` +
          `<button class="t-btn" id="tb-${tid}" onclick="timerToggle('${tid}')">${running?"Stop":"Start"}</button>` +
          `<button class="t-btn" onclick="timerReset('${tid}')">Reset</button></div>`;
      }
      h += `<div class="ex"><div class="ex-top"><span class="ex-name">${esc(it.name)}</span>
            <span class="ex-load">${load}</span></div>
            <div class="ex-scheme">${it.sets} × ${esc(it.reps)}</div>
            ${it.note?`<div class="ex-note">${esc(it.note)}</div>`:""}
            <div class="plates">${plates}</div>${timerHtml}</div>`;
    });
    h += `</div>`;
  });
  h += `<button class="btn" onclick="resetDay()">Clear check-offs for this day</button>`;
  if(!storageOK) h += `<div class="storage-note">Heads-up: saved storage isn't available right now — check-offs will reset when you close this page.</div>`;
  $("main").innerHTML = h;
}

function renderSetup(){
  const m = state.maxes;
  const fields = [
    ["bench","Bench press 1RM",""],["squat","Back squat 1RM",""],
    ["dead","Deadlift 1RM","conventional"],
    ["sumo","Sumo deadlift 1RM","optional — blank = 92.5% of conventional"],
    ["ohp","Overhead press 1RM",""],
    ["row8","Barbell row · 8-rep weight","estimates a working max"],
    ["inc","Rounding increment","5 lb default · 2.5 if you have small plates"]
  ];
  let h = `<div class="session-title">Setup</div>
    <div class="setup"><p>Enter maxes once — every weight in the plan calculates from these and saves automatically.</p>`;
  fields.forEach(([k,lab,sm])=>{
    let der = "";
    if(k==="sumo" && !num(m.sumo) && oneRM("sumo")) der = `<div class="derived">using ${oneRM("sumo")} lb</div>`;
    if(k==="row8" && oneRM("row")) der = `<div class="derived">→ est. max ${oneRM("row")} lb</div>`;
    h += `<div class="field"><label>${lab}${sm?`<small>${sm}</small>`:""}${der}</label>
      <input inputmode="decimal" value="${esc(m[k]??"")}" onchange="setMax('${k}',this.value)"></div>`;
  });
  h += `<button class="btn danger" onclick="resetAll()">Reset all check-offs (start a new cycle)</button>`;
  h += `<div class="eyebrow" style="margin-top:26px"><span>Backup &amp; restore</span><span class="hint">plain JSON</span></div>
    <textarea id="io" class="io" placeholder="Export fills this box with your data as JSON (and copies it). Paste a backup here and hit Restore to load it." spellcheck="false"></textarea>
    <div class="btnrow">
      <button class="btn" onclick="exportData()">Export data</button>
      <button class="btn" onclick="importData()">Restore from JSON</button>
    </div>`;
  h += `<div class="storage-note">${storageOK
    ? "Data saves on this device automatically."
    : "Heads-up: saved storage isn't available right now — entries will reset when you close this page."}</div></div>`;
  $("main").innerHTML = h;
}

function renderProgress(){
  if(state.day===0){ $("prog").textContent = ""; return; }
  const def = dayDef(state.day, state.week);
  let tot=0, done=0;
  def.blocks.forEach((blk,bi)=>blk.items.forEach((it,ii)=>{
    for(let s=0;s<it.sets;s++){ tot++; if(state.checks[key(state.day,bi,ii,s)]) done++; }
  }));
  $("prog").innerHTML = `<b>${done}</b>/${tot} sets`;
}

/* ================= actions ================= */
window.setWeek = w => { state.week=w; save(); render(); };
window.setDay  = d => { state.day=d; save(); render(); window.scrollTo(0,0); };
window.toggle  = (b,i,s) => {
  const k = key(state.day,b,i,s);
  if(state.checks[k]) delete state.checks[k]; else state.checks[k]=1;
  save(); renderSession(); renderProgress();
};
window.setMax = (k,v) => { state.maxes[k]=v.trim(); save(); renderSetup(); };
window.resetDay = () => {
  const pre = `${state.week}-${state.day}-`;
  Object.keys(state.checks).forEach(k=>{ if(k.startsWith(pre)) delete state.checks[k]; });
  save(); render();
};
window.resetAll = () => {
  if(!confirm("Clear every check-off across all 6 weeks? Maxes are kept.")) return;
  state.checks = {}; save(); render();
};
window.exportData = () => {
  const payload = JSON.stringify({v:1, exported:new Date().toISOString(),
    maxes:state.maxes, checks:state.checks});
  const ta = $("io"); ta.value = payload; ta.focus(); ta.select();
  try{ navigator.clipboard.writeText(payload); }catch(e){}
};
window.importData = () => {
  const ta = $("io");
  if(!ta.value.trim()){ alert("Paste a backup into the box first."); return; }
  try{
    const s = JSON.parse(ta.value);
    if(!s || (typeof s.maxes!=="object" && typeof s.checks!=="object"))
      throw new Error("missing fields");
    if(s.maxes) state.maxes = {...state.maxes, ...s.maxes};
    if(s.checks && typeof s.checks==="object") state.checks = s.checks;
    save(); render();
  }catch(e){ alert("That doesn't look like a valid backup. Export creates the exact format this expects."); }
};

/* ================= rest timer ================= */
const TIMERS = {};
const tfmt = sec => Math.floor(sec/60) + ":" + String(Math.floor(sec%60)).padStart(2,"0");
function tState(id){ if(!TIMERS[id]) TIMERS[id] = {acc:0, startTs:null}; return TIMERS[id]; }
function tElapsed(t){ return t.acc + (t.startTs ? (Date.now()-t.startTs)/1000 : 0); }
function syncTimer(id){
  const d = document.getElementById("td-"+id), b = document.getElementById("tb-"+id);
  if(!d) return;
  const t = tState(id);
  d.textContent = tfmt(tElapsed(t));
  d.classList.toggle("running", !!t.startTs);
  if(b) b.textContent = t.startTs ? "Stop" : "Start";
}
window.timerToggle = id => {
  const t = tState(id);
  if(t.startTs){ t.acc = tElapsed(t); t.startTs = null; }
  else{ t.startTs = Date.now(); }
  syncTimer(id);
};
window.timerReset = id => { const t = tState(id); t.acc = 0; t.startTs = null; syncTimer(id); };
setInterval(()=>{ for(const id in TIMERS){ if(TIMERS[id].startTs) syncTimer(id); } }, 500);

loadState().then(()=>{
  if(!num(state.maxes.bench) && state.day!==0) state.day = 0;
  render();
});
</script>
</body>
</html>
